{% extends "layout.html" %}

{% block title %}Uusi elokuva{% endblock %}

{% block content %}
<h2>Uusi elokuva</h2>

<form action="/create_movie" method="post">
  <p>
    <label for="title">Nimi</label>: <br />
    <input type="text" name="title" id="title" maxlength="50" required />
  </p>
  <p>
    <label for="year">Valmistumisvuosi</label>: <br />
    <input type="text" name="year" id="year" size="6" pattern="[0-9]{4}" required />
  </p>
  <p>
    <label for="description">Kuvaus</label>: <br />
    <textarea name="description" id="description" rows="8" cols="60" maxlength="1000" required></textarea>
  </p>
  <p>
    Genre: <br />
  {% for genre in genres %}
    <input type="checkbox" name="genres" value="{{ genre.id }}" id="genre{{ genre.id }}" />
    <label for="genre{{ genre.id }}">{{ genre.name }}</label> <br />
  {% endfor %}
  </p>
  <p>
    <label for="age_rating">Ikäraja</label>: <br />
    <select name="age_rating" id="age_rating">
      <option value="">(ei ikärajaa)</option>
    {% for age_rating in age_ratings %}
      <option value="{{ age_rating.id }}">{{ age_rating.name }}</option>
    {% endfor %}
    </select>
  </p>
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Lisää elokuva" />
</form>
{% endblock %}
