{% extends "layout.html" %}

{% block title %}Elokuvatietokanta{% endblock %}

{% block content %}
<h2>Elokuvat</h2>

{% for movie in movies %}
<div class="movie">
  <a href="/movie/{{ movie.id }}">{{ movie.title }}</a> ({{ movie.year }}) <br />
  Lisännyt: <a href="/user/{{ movie.user_id }}">{{ movie.username }}</a>
</div>
{% endfor %}
{% endblock %}
